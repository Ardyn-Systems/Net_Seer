[project]
name = "netseer"
version = "0.1.0"
description = "NetSeer — turn traffic into terrain. Map Layer 2/3 surveys to interactive maps and draw.io / Visio exports."
readme = "README.md"
authors = [
    { name = "NetSeer" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "scapy>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]

[project.scripts]
netseer = "netseer.cli:main"

[project.gui-scripts]
netseer-desktop = "netseer.desktop:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
