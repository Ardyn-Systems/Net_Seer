name: Linux build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "packaging/**", "pyproject.toml", ".github/workflows/linux.yml"]

permissions:
  contents: write

jobs:
  build:
    # Build on the oldest supported Ubuntu so the binaries run on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install . "pyinstaller>=6.10" pytest httpx
      - name: Test
        run: python -m pytest -q
      - name: Version
        id: version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: pyinstaller packaging/linux/netseer.spec --noconfirm --clean
      - name: Smoke test the bundle
        run: dist/NetSeer/NetSeer --smoke-test
      - name: AppImage and tarball
        run: bash packaging/linux/build-appimage.sh "${{ steps.version.outputs.version }}"
      - name: Smoke test the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/NetSeer-${{ steps.version.outputs.version }}-x86_64.AppImage" --smoke-test
      - name: Checksums
        run: (cd dist && sha256sum *.AppImage *.tar.gz | tee SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NetSeer-linux-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
