name: Electron

# Re-arm event triggers after the 2026-10 org transfer to Ardyn-Systems/Net_Seer
# (push/pull_request triggers went dormant post-transfer). Touching this file on the
# default branch re-registers the workflow's trigger wiring.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish a release for (e.g. v0.8.10). Leave blank to build without publishing. Temporary stopgap while the push-tag trigger is dormant after the repo transfer."
        required: false
        default: ""
  pull_request:
    paths: ["electron/**", "packaging/electron/**", "src/**", "pyproject.toml", ".github/workflows/electron.yml"]

permissions:
  contents: write

jobs:
  smoke:
    name: Smoke (from source)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetSeer (the sidecar)
        run: python -m pip install --upgrade pip && python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System libraries for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcomposite1 \
            libxdamage1 libxrandr2 libxkbcommon0 libpango-1.0-0 libcairo2
      - name: Install Electron
        working-directory: electron
        run: npm install
      - name: Smoke test (starts the backend, loads the UI, exits 0)
        working-directory: electron
        env:
          NETSEER_PYTHON: python
          ELECTRON_ENABLE_LOGGING: "1"
        run: xvfb-run -a npm run smoke -- --no-sandbox

  package-linux:
    name: Package + smoke (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetSeer + PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install . "pyinstaller>=6.10"
      - name: Freeze the server sidecar
        run: pyinstaller packaging/electron/netseer-server.spec --noconfirm --clean
      - name: Smoke the frozen sidecar
        run: |
          ./dist/netseer-server/netseer-server --host 127.0.0.1 --port 8765 &
          sid=$!
          ok=
          for _ in $(seq 1 40); do if curl -sf http://127.0.0.1:8765/api/health >/dev/null; then ok=1; break; fi; sleep 0.5; done
          kill $sid 2>/dev/null || true
          [ -n "$ok" ] || { echo "sidecar never answered"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System libraries for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcomposite1 \
            libxdamage1 libxrandr2 libxkbcommon0 libpango-1.0-0 libcairo2
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./electron/package.json').version")
          if [ -n "${{ inputs.release_tag }}" ]; then t="${{ inputs.release_tag }}"; v="${t#v}";
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Set package version
        working-directory: electron
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build the AppImage + tar.gz (bundles the sidecar)
        working-directory: electron
        # -p never: build the update metadata (latest-linux.yml) but don't upload; the release step
        # below attaches everything.
        run: npm install && npx electron-builder --linux AppImage tar.gz -p never
      - name: Smoke the packaged AppImage
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a electron/dist/*.AppImage --smoke-test --no-sandbox
      - name: Checksums
        run: (cd electron/dist && sha256sum *.AppImage *.tar.gz | tee SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NetSeer-linux
          if-no-files-found: warn
          path: |
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/latest-linux.yml
            electron/dist/SHA256SUMS-linux.txt
      - name: Attach to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/latest-linux.yml
            electron/dist/SHA256SUMS-linux.txt

  package-windows:
    name: Package + smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetSeer + PyInstaller
        run: python -m pip install --upgrade pip; python -m pip install . "pyinstaller>=6.10"
      - name: Freeze the server sidecar
        run: pyinstaller packaging/electron/netseer-server.spec --noconfirm --clean
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./electron/package.json').version")
          if [ -n "${{ inputs.release_tag }}" ]; then t="${{ inputs.release_tag }}"; v="${t#v}";
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Set package version
        working-directory: electron
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build the installer + portable (bundles the sidecar)
        working-directory: electron
        # Authenticode signing turns on automatically when the CSC secrets exist (see
        # packaging/windows/SIGNING.md); without them it builds unsigned.
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm install; npx electron-builder --win -p never
      - name: Smoke the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "electron/dist/win-unpacked/NetSeer.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke failed with exit $($p.ExitCode)" }
      - name: Checksums
        shell: bash
        run: (cd electron/dist && sha256sum *.exe *.zip | tee SHA256SUMS-windows.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NetSeer-windows
          if-no-files-found: warn
          path: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest.yml
            electron/dist/SHA256SUMS-windows.txt
      - name: Attach to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest.yml
            electron/dist/SHA256SUMS-windows.txt
