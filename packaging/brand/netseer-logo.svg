<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>NetSeer</title>
  <!-- Profile: a traffic graph that is also a mountain profile. Turn traffic into terrain. -->
  <rect width="64" height="64" rx="14" fill="#15140f"/>
  <!-- Contour stripes are pre-clipped to the terrain so every renderer (browsers, MuPDF, Inkscape) draws the same thing. -->
  <g fill="none" stroke-width="1.6" stroke-linecap="butt">
    <path d="M44.60 20 H50.00" stroke="#e0a84a" stroke-opacity=".4"/>
    <path d="M41.40 28 H54.00" stroke="#7fb6c9" stroke-opacity=".5"/>
    <path d="M27.40 36 H58.00" stroke="#9cc27a" stroke-opacity=".5"/>
    <path d="M11.75 44 H19.33 M22.60 44 H59.00" stroke="#7fb6c9" stroke-opacity=".45"/>
    <path d="M5.00 52 H59.00" stroke="#9cc27a" stroke-opacity=".35"/>
  </g>
  <path d="M5 50 L14 42 L22 45 L31 30 L39 34 L47 14 L59 38" fill="none" stroke="#e0a84a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="14" cy="42" r="3" fill="#15140f" stroke="#9cc27a" stroke-width="2.4"/>
  <circle cx="31" cy="30" r="3" fill="#15140f" stroke="#7fb6c9" stroke-width="2.4"/>
  <circle cx="59" cy="38" r="3" fill="#15140f" stroke="#9cc27a" stroke-width="2.4"/>
  <circle cx="47" cy="14" r="4.8" fill="#e0a84a"/>
</svg>
