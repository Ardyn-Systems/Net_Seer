<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-label="NetSeer data flow: a capture opened in the browser is parsed by the FastAPI backend and drawn as a map saved in the browser">
<style>
.box{stroke-width:1}
.t{font:600 14px 'Segoe UI',system-ui,sans-serif}
.s{font:12px 'Segoe UI',system-ui,sans-serif}
.lh{font:600 13px 'Segoe UI',system-ui,sans-serif;fill:#44464d}
.lbl{font:12px 'Segoe UI',system-ui,sans-serif;fill:#55585f}
.ln{stroke:#9aa0aa;stroke-width:1.5;fill:none}
.cont{fill:none;stroke:#c3c7cf;stroke-width:1;stroke-dasharray:5 4}
.teal-b{fill:#E1F5EE;stroke:#1D9E75}.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
.pur-b{fill:#EEEDFE;stroke:#534AB7}.pur-t{fill:#26215C}.pur-s{fill:#3C3489}
.gray-b{fill:#F1EFE8;stroke:#888780}.gray-t{fill:#2C2C2A}.gray-s{fill:#5F5E5A}
.amb-b{fill:#FAEEDA;stroke:#BA7517}.amb-t{fill:#412402}.amb-s{fill:#854F0B}
.cor-b{fill:#FAECE7;stroke:#D85A30}.cor-t{fill:#4A1B0C}.cor-s{fill:#993C1D}
@media (prefers-color-scheme:dark){.lh{fill:#c6cad2}.lbl{fill:#aeb2bb}.ln{stroke:#6f7580}.cont{stroke:#4a4e57}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="cont" x="24" y="40" width="772" height="150" rx="10"/>
<text class="lh" x="36" y="62">Your browser or app window</text>
<rect class="box gray-b" x="44" y="92" width="160" height="60" rx="8"/>
<text class="t gray-t" x="124" y="114" text-anchor="middle" dominant-baseline="central">Open a capture</text>
<text class="s gray-s" x="124" y="134" text-anchor="middle" dominant-baseline="central">pcap · Kismet · csv</text>
<rect class="box teal-b" x="238" y="92" width="150" height="60" rx="8"/>
<text class="t teal-t" x="313" y="114" text-anchor="middle" dominant-baseline="central">app.js</text>
<text class="s teal-s" x="313" y="134" text-anchor="middle" dominant-baseline="central">UI + requests</text>
<rect class="box teal-b" x="420" y="92" width="150" height="60" rx="8"/>
<text class="t teal-t" x="495" y="114" text-anchor="middle" dominant-baseline="central">Cytoscape.js</text>
<text class="s teal-s" x="495" y="134" text-anchor="middle" dominant-baseline="central">draws the map</text>
<rect class="box amb-b" x="602" y="92" width="170" height="60" rx="8"/>
<text class="t amb-t" x="687" y="114" text-anchor="middle" dominant-baseline="central">Browser storage</text>
<text class="s amb-s" x="687" y="134" text-anchor="middle" dominant-baseline="central">maps · names · notes</text>

<line class="ln" x1="204" y1="122" x2="230" y2="122" marker-end="url(#a)"/>
<line class="ln" x1="388" y1="122" x2="412" y2="122" marker-end="url(#a)"/>
<line class="ln" x1="570" y1="122" x2="594" y2="122" marker-end="url(#a)"/>

<rect class="cont" x="24" y="250" width="772" height="150" rx="10"/>
<text class="lh" x="36" y="272">FastAPI backend · uvicorn  (local, or hosted on Render)</text>
<rect class="box pur-b" x="44" y="302" width="160" height="60" rx="8"/>
<text class="t pur-t" x="124" y="324" text-anchor="middle" dominant-baseline="central">/api/parse</text>
<text class="s pur-s" x="124" y="344" text-anchor="middle" dominant-baseline="central">upload endpoint</text>
<rect class="box cor-b" x="238" y="302" width="170" height="60" rx="8"/>
<text class="t cor-t" x="323" y="324" text-anchor="middle" dominant-baseline="central">Parsers</text>
<text class="s cor-s" x="323" y="344" text-anchor="middle" dominant-baseline="central">scapy, Kismet, csv</text>
<rect class="box pur-b" x="438" y="302" width="150" height="60" rx="8"/>
<text class="t pur-t" x="513" y="324" text-anchor="middle" dominant-baseline="central">graph.py</text>
<text class="s pur-s" x="513" y="344" text-anchor="middle" dominant-baseline="central">builds the graph</text>
<rect class="box pur-b" x="618" y="302" width="160" height="60" rx="8"/>
<text class="t pur-t" x="698" y="324" text-anchor="middle" dominant-baseline="central">graph JSON</text>
<text class="s pur-s" x="698" y="344" text-anchor="middle" dominant-baseline="central">devices · links</text>

<line class="ln" x1="204" y1="332" x2="230" y2="332" marker-end="url(#a)"/>
<line class="ln" x1="408" y1="332" x2="430" y2="332" marker-end="url(#a)"/>
<line class="ln" x1="588" y1="332" x2="610" y2="332" marker-end="url(#a)"/>

<path class="ln" d="M313 152 L313 220 L124 220 L124 300" marker-end="url(#a)"/>
<text class="lbl" x="150" y="210">POST capture</text>
<path class="ln" d="M698 302 L698 220 L495 220 L495 154" marker-end="url(#a)"/>
<text class="lbl" x="540" y="210">returns graph</text>

<rect class="box teal-b" x="60" y="424" width="12" height="12" rx="3"/><text class="lbl" x="78" y="430" dominant-baseline="central">frontend</text>
<rect class="box pur-b" x="200" y="424" width="12" height="12" rx="3"/><text class="lbl" x="218" y="430" dominant-baseline="central">backend</text>
<rect class="box cor-b" x="340" y="424" width="12" height="12" rx="3"/><text class="lbl" x="358" y="430" dominant-baseline="central">parsers</text>
<rect class="box amb-b" x="470" y="424" width="12" height="12" rx="3"/><text class="lbl" x="488" y="430" dominant-baseline="central">storage</text>
<rect class="box gray-b" x="600" y="424" width="12" height="12" rx="3"/><text class="lbl" x="618" y="430" dominant-baseline="central">input</text>
</svg>
