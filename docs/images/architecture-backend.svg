<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-label="NetSeer backend: each API route group maps to an engine module and produces a result">
<style>
.box{stroke-width:1}
.t{font:600 14px 'Segoe UI',system-ui,sans-serif}
.s{font:12px 'Segoe UI',system-ui,sans-serif}
.lh{font:600 13px 'Segoe UI',system-ui,sans-serif;fill:#44464d}
.lbl{font:12px 'Segoe UI',system-ui,sans-serif;fill:#55585f}
.ln{stroke:#9aa0aa;stroke-width:1.5;fill:none}
.pur-b{fill:#EEEDFE;stroke:#534AB7}.pur-t{fill:#26215C}.pur-s{fill:#3C3489}
.gray-b{fill:#F1EFE8;stroke:#888780}.gray-t{fill:#2C2C2A}.gray-s{fill:#5F5E5A}
.cor-b{fill:#FAECE7;stroke:#D85A30}.cor-t{fill:#4A1B0C}.cor-s{fill:#993C1D}
@media (prefers-color-scheme:dark){.lh{fill:#c6cad2}.lbl{fill:#aeb2bb}.ln{stroke:#6f7580}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="lh" x="36" y="42">API routes</text>
<text class="lh" x="300" y="42">Engines</text>
<text class="lh" x="590" y="42">Results</text>

<rect class="box pur-b" x="36" y="56" width="170" height="64" rx="8"/>
<text class="t pur-t" x="121" y="78" text-anchor="middle" dominant-baseline="central">/api/parse</text>
<text class="s pur-s" x="121" y="98" text-anchor="middle" dominant-baseline="central">upload</text>
<rect class="box cor-b" x="300" y="56" width="210" height="64" rx="8"/>
<text class="t cor-t" x="405" y="78" text-anchor="middle" dominant-baseline="central">Parsers</text>
<text class="s cor-s" x="405" y="98" text-anchor="middle" dominant-baseline="central">scapy, Kismet, airodump</text>
<rect class="box gray-b" x="590" y="56" width="200" height="64" rx="8"/>
<text class="t gray-t" x="690" y="78" text-anchor="middle" dominant-baseline="central">Network graph</text>
<text class="s gray-s" x="690" y="98" text-anchor="middle" dominant-baseline="central">devices · links</text>

<rect class="box pur-b" x="36" y="146" width="170" height="64" rx="8"/>
<text class="t pur-t" x="121" y="168" text-anchor="middle" dominant-baseline="central">/api/security</text>
<text class="s pur-s" x="121" y="188" text-anchor="middle" dominant-baseline="central">assess</text>
<rect class="box pur-b" x="300" y="146" width="210" height="64" rx="8"/>
<text class="t pur-t" x="405" y="168" text-anchor="middle" dominant-baseline="central">Security engine</text>
<text class="s pur-s" x="405" y="188" text-anchor="middle" dominant-baseline="central">banners &#8594; CVEs</text>
<rect class="box gray-b" x="590" y="146" width="200" height="64" rx="8"/>
<text class="t gray-t" x="690" y="168" text-anchor="middle" dominant-baseline="central">Vuln findings</text>
<text class="s gray-s" x="690" y="188" text-anchor="middle" dominant-baseline="central">EPSS · CVSS · KEV</text>

<rect class="box pur-b" x="36" y="236" width="170" height="64" rx="8"/>
<text class="t pur-t" x="121" y="258" text-anchor="middle" dominant-baseline="central">/api/export</text>
<text class="s pur-s" x="121" y="278" text-anchor="middle" dominant-baseline="central">diagrams</text>
<rect class="box pur-b" x="300" y="236" width="210" height="64" rx="8"/>
<text class="t pur-t" x="405" y="258" text-anchor="middle" dominant-baseline="central">Exporters</text>
<text class="s pur-s" x="405" y="278" text-anchor="middle" dominant-baseline="central">drawio · visio · reports</text>
<rect class="box gray-b" x="590" y="236" width="200" height="64" rx="8"/>
<text class="t gray-t" x="690" y="258" text-anchor="middle" dominant-baseline="central">Export files</text>
<text class="s gray-s" x="690" y="278" text-anchor="middle" dominant-baseline="central">.drawio · .vsdx · .pdf</text>

<rect class="box pur-b" x="36" y="326" width="170" height="64" rx="8"/>
<text class="t pur-t" x="121" y="348" text-anchor="middle" dominant-baseline="central">/api/update</text>
<text class="s pur-s" x="121" y="368" text-anchor="middle" dominant-baseline="central">desktop only</text>
<rect class="box pur-b" x="300" y="326" width="210" height="64" rx="8"/>
<text class="t pur-t" x="405" y="348" text-anchor="middle" dominant-baseline="central">Updater</text>
<text class="s pur-s" x="405" y="368" text-anchor="middle" dominant-baseline="central">download · verify</text>
<rect class="box gray-b" x="590" y="326" width="200" height="64" rx="8"/>
<text class="t gray-t" x="690" y="348" text-anchor="middle" dominant-baseline="central">GitHub release</text>
<text class="s gray-s" x="690" y="368" text-anchor="middle" dominant-baseline="central">verified download</text>

<line class="ln" x1="206" y1="88" x2="294" y2="88" marker-end="url(#a)"/>
<line class="ln" x1="510" y1="88" x2="584" y2="88" marker-end="url(#a)"/>
<line class="ln" x1="206" y1="178" x2="294" y2="178" marker-end="url(#a)"/>
<line class="ln" x1="510" y1="178" x2="584" y2="178" marker-end="url(#a)"/>
<line class="ln" x1="206" y1="268" x2="294" y2="268" marker-end="url(#a)"/>
<line class="ln" x1="510" y1="268" x2="584" y2="268" marker-end="url(#a)"/>
<line class="ln" x1="206" y1="358" x2="294" y2="358" marker-end="url(#a)"/>
<line class="ln" x1="510" y1="358" x2="584" y2="358" marker-end="url(#a)"/>

<rect class="box pur-b" x="140" y="414" width="12" height="12" rx="3"/><text class="lbl" x="158" y="420" dominant-baseline="central">routes &amp; engines</text>
<rect class="box cor-b" x="320" y="414" width="12" height="12" rx="3"/><text class="lbl" x="338" y="420" dominant-baseline="central">parsers</text>
<rect class="box gray-b" x="470" y="414" width="12" height="12" rx="3"/><text class="lbl" x="488" y="420" dominant-baseline="central">results</text>
</svg>
